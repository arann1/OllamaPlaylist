name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Verify imports
        env:
          SPOTIFY_CLIENT_ID: ci-test
          SPOTIFY_CLIENT_SECRET: ci-test
          SPOTIFY_REDIRECT_URI: http://localhost:8888/callback
          OLLAMA_HOST: http://localhost:11434
        run: |
          cd backend && python -c "import analyzer; import spotify; import tracker; import config"

      - name: Check for syntax errors
        run: |
          python -m py_compile backend/playlist_updater.py backend/analyzer.py backend/spotify.py backend/tracker.py backend/config.py
