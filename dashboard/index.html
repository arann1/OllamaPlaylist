<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OllamaPlaylist · Taste Tower</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/renderers/CSS2DRenderer.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #050505; --border: rgba(255,255,255,0.07);
      --text: #fff; --dim: #444; --muted: #888;
      --green: #1ed760; --purple: #b967ff; --cyan: #59cfcf;
      --pink: #f037a5; --amber: #ffa42b;
    }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }

    /* TOPBAR */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 52px; z-index: 300;
      display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
      background: rgba(5,5,5,0.95); border-bottom: 1px solid var(--border); backdrop-filter: blur(16px);
    }
    .tb-left { display: flex; align-items: center; gap: 10px; }
    .logo { font-size: 15px; font-weight: 800; letter-spacing: -0.03em; }
    .pill { font-size: 10px; padding: 2px 9px; border-radius: 20px; font-weight: 700; background: rgba(30,215,96,.08); color: var(--green); border: 1px solid rgba(30,215,96,.22); }
    #last-upd { font-size: 11px; color: var(--dim); }

    /* LOADING */
    #loading { position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--bg); }
    .spin { width: 28px; height: 28px; border: 2px solid rgba(255,255,255,.06); border-top-color: var(--green); border-radius: 50%; animation: rot .7s linear infinite; }
    @keyframes rot { to { transform: rotate(360deg); } }
    #loading p { font-size: 12px; color: var(--dim); }

    /* APP */
    #app { display: none; position: fixed; top: 52px; left: 0; right: 0; bottom: 0; }

    /* CANVAS WRAP */
    #wrap { position: relative; width: 100%; height: 100%; overflow: hidden; }
    #c { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }

    /* SECTION DOTS */
    #dots {
      position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 10px; z-index: 20;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.15);
      border: none; cursor: pointer; transition: all .25s; padding: 0;
    }
    .dot.on { background: #fff; transform: scale(1.5); }
    .dot:hover:not(.on) { background: rgba(255,255,255,.45); }

    /* SECTION HUD */
    #hud {
      position: absolute; left: 22px; top: 18px;
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
      color: rgba(255,255,255,.25); pointer-events: none; transition: color .4s;
    }

    /* RUN NAV */
    #run-nav {
      position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 14px;
      background: rgba(8,8,8,.9); border: 1px solid var(--border); border-radius: 30px;
      padding: 8px 20px; backdrop-filter: blur(14px); white-space: nowrap; z-index: 20;
    }
    .nb { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; transition: color .12s; }
    .nb:hover:not([disabled]) { color: #fff; }
    .nb[disabled] { color: #1e1e1e; cursor: default; }
    #ni { text-align: center; }
    #nm { font-size: 13px; font-weight: 700; text-transform: capitalize; }
    #nd { font-size: 10px; color: var(--dim); }

    /* HINT */
    #hint { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #252525; pointer-events: none; white-space: nowrap; transition: opacity .5s; }

    /* TOOLTIP */
    #tip {
      position: absolute; background: rgba(6,6,6,.96); border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px; padding: 9px 13px; font-size: 12px; line-height: 1.6;
      pointer-events: none; opacity: 0; transition: opacity .1s; z-index: 40; max-width: 200px;
    }
    #tip b { display: block; font-size: 13px; margin-bottom: 2px; }
    #tip em { font-style: normal; color: var(--green); font-size: 10px; }

    /* CSS2D labels */
    .lbl { pointer-events: none; white-space: nowrap; padding-left: 8px; border-left: 2px solid currentColor; }
    .lbl span { display: block; font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: currentColor; text-shadow: 0 0 10px currentColor; }

    /* INFO PANEL */
    #panel {
      position: absolute; top: 0; right: 0; bottom: 0; width: 360px;
      background: rgba(5,5,5,.98); border-left: 1px solid var(--border);
      transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1);
      overflow-y: auto; overflow-x: hidden; padding: 28px 22px 48px;
      z-index: 100; scrollbar-width: thin; scrollbar-color: #1a1a1a transparent;
    }
    #panel.open { transform: translateX(0); }
    #px { position: absolute; top: 14px; right: 14px; background: none; border: 1px solid var(--border); color: var(--dim); width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; transition: all .12s; }
    #px:hover { color: #fff; border-color: rgba(255,255,255,.2); }

    /* Panel inner */
    .pi { font-size: 28px; display: block; margin-bottom: 10px; }
    .pt { font-size: 21px; font-weight: 800; margin-bottom: 18px; }
    .ps { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--dim); margin: 20px 0 9px; }
    .pb { font-size: 13px; color: var(--muted); line-height: 1.75; }
    .sg { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .sc { background: rgba(255,255,255,.025); border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; }
    .sc span { display: block; font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 4px; }
    .sc strong { font-size: 13px; font-weight: 700; }
    .ebg { font-size: 34px; font-weight: 900; text-transform: uppercase; display: block; margin-bottom: 18px; }
    .md { font-size: 24px; font-weight: 800; text-transform: capitalize; margin-bottom: 12px; }
    .tr { display: flex; flex-wrap: wrap; gap: 6px; }
    .tg { font-size: 11px; padding: 3px 10px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 20px; color: var(--muted); }
    .tgp { background: rgba(185,103,255,.08); border-color: rgba(185,103,255,.22); color: var(--purple); }
    .gl { display: flex; flex-direction: column; gap: 9px; }
    .gr { display: flex; align-items: center; gap: 9px; }
    .gr > span { font-size: 12px; width: 105px; color: var(--muted); text-transform: capitalize; }
    .gb { flex: 1; height: 4px; background: rgba(255,255,255,.05); border-radius: 2px; overflow: hidden; }
    .gf { height: 100%; border-radius: 2px; }
    .al { display: flex; flex-direction: column; gap: 9px; }
    .ar { display: flex; align-items: center; gap: 11px; }
    .av { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: rgba(255,255,255,.06); }
    .avp { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
    .an { font-size: 13px; font-weight: 600; flex: 1; }
    .rnk { font-size: 10px; color: var(--dim); font-weight: 600; }
    .rnk.tp { color: var(--green); }
    .dl { display: flex; flex-direction: column; gap: 7px; }
    .dw { font-weight: 800; text-transform: capitalize; }
    .tl { display: flex; flex-direction: column; gap: 9px; }
    .tr2 { display: flex; align-items: center; gap: 11px; }
    .ta { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
    .tap { width: 40px; height: 40px; border-radius: 6px; background: rgba(255,255,255,.05); display: flex; align-items: center; justify-content: center; color: var(--dim); flex-shrink: 0; }
    .tn { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
    .tar { font-size: 10px; color: var(--dim); }

    @media (max-width: 640px) {
      #panel { position: fixed; width: 100%; height: 55%; top: auto; left: 0; bottom: 0; border-left: none; border-top: 1px solid var(--border); transform: translateY(100%); }
      #panel.open { transform: translateY(0); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="tb-left">
      <span class="logo">OllamaPlaylist</span>
      <span id="mpill" class="pill">—</span>
    </div>
    <span id="last-upd"></span>
  </header>

  <div id="loading"><div class="spin"></div><p>Loading taste data…</p></div>

  <div id="app">
    <div id="wrap">
      <canvas id="c"></canvas>
      <!-- labelRenderer DOM mounts here -->
      <div id="dots"></div>
      <div id="hud"></div>
      <div id="hint">scroll · arrow keys · click a floor</div>
      <div id="run-nav">
        <button class="nb" id="bp">‹</button>
        <div id="ni"><div id="nm"></div><div id="nd"></div></div>
        <button class="nb" id="bn">›</button>
      </div>
      <div id="tip"><b id="tt"></b><span id="ts"></span><em>click to explore →</em></div>
      <aside id="panel">
        <button id="px">×</button>
        <div id="pb"><p style="color:var(--dim);font-size:13px;margin-top:36px">Click any section to explore your music data.</p></div>
      </aside>
    </div>
  </div>

  <!-- Panel content renderer -->
  <script>
    var GC = [0xb967ff,0xf037a5,0x477dff,0xff8c00,0x59cfcf];
    var GCS = ['#b967ff','#f037a5','#477dff','#ff8c00','#59cfcf'];
    var EC = { low:'#59cfcf', medium:'#ffa42b', high:'#1ed760' };

    function fs(s){ if(!s)return'—'; return Math.floor(s/60)+'m '+Math.round(s%60)+'s'; }
    function si(l,v){ return '<div class="sc"><span>'+l+'</span><strong>'+v+'</strong></div>'; }

    function renderPanel(sec, run) {
      var h = '';
      if (sec==='OVERVIEW') {
        h='<span class="pi">📊</span><h2 class="pt">Run Overview</h2>'
         +'<div class="sg">'+si('Date',run.date)+si('Time',run.time)+si('Tracks',run.tracks_added)+si('Runtime',fs(run.runtime_seconds))+si('Model',run.model||'—')+si('Library',(run.library_artist_count||'—')+' artists')+'</div>'
         +'<div class="ps">Source playlists</div><div class="tr">'+(run.source_playlists||[]).map(function(p){return'<span class="tg">'+p+'</span>';}).join('')+'</div>';
      } else if (sec==='ENERGY') {
        h='<span class="pi">⚡</span><h2 class="pt">Energy Level</h2>'
         +'<span class="ebg" style="color:'+(EC[run.energy_level]||'#1ed760')+'">'+(run.energy_level||'—')+'</span>'
         +'<div class="sg">'+si('Tracks',run.tracks_added)+si('Runtime',fs(run.runtime_seconds))+'</div>';
      } else if (sec==='MOOD') {
        h='<span class="pi">💭</span><h2 class="pt">Mood</h2>'
         +'<div class="md">'+(run.mood||'—')+'</div>'
         +'<p class="pb">'+(run.summary||'')+'</p>';
      } else if (sec==='GENRES') {
        h='<span class="pi">🎵</span><h2 class="pt">Genre DNA</h2>'
         +'<div class="gl">'+(run.genres||[]).map(function(g,i){return'<div class="gr"><span>'+g+'</span><div class="gb"><div class="gf" style="width:'+(100-i*17)+'%;background:'+GCS[i%5]+'"></div></div></div>';}).join('')+'</div>'
         +'<div class="ps">Taste profile</div><div class="tr">'+(run.taste_profile||[]).map(function(t){return'<span class="tg tgp">'+t+'</span>';}).join('')+'</div>';
      } else if (sec==='ARTISTS') {
        h='<span class="pi">👤</span><h2 class="pt">Top Artists</h2>'
         +'<div class="al">'+(run.preferred_artists_detail||[]).map(function(a,i){
             var n=a.name||'?';
             var av=a.image?'<img class="av" src="'+a.image+'" alt="" onerror="this.style.display=\'none\'">':'<div class="avp">'+n[0]+'</div>';
             return'<div class="ar">'+av+'<span class="an">'+n+'</span><span class="rnk'+(i<3?' tp':'')+'">'+(['🥇','🥈','🥉','#4','#5'][i]||'#'+(i+1))+'</span></div>';
           }).join('')+'</div>';
      } else if (sec==='DNA') {
        h='<span class="pi">🧬</span><h2 class="pt">Taste Profile</h2>'
         +'<div class="dl">'+(run.taste_profile||[]).map(function(t,i){return'<div class="dw" style="font-size:'+(22-i*2)+'px;color:'+GCS[i%5]+'">'+t+'</div>';}).join('')+'</div>';
      } else if (sec==='CURATED') {
        h='<span class="pi">🎧</span><h2 class="pt">Curated Playlist</h2>'
         +'<p class="pb" style="margin-bottom:14px">'+(run.curated_tracks_sample||[]).length+' tracks · AI-selected from your library</p>'
         +'<div class="tl">'+(run.curated_tracks_sample||[]).map(function(t){
             var a=t.album_art?'<img class="ta" src="'+t.album_art+'" alt="">':'<div class="tap">♪</div>';
             return'<div class="tr2">'+a+'<div><div class="tn">'+t.name+'</div><div class="tar">'+t.artist+'</div></div></div>';
           }).join('')+'</div>';
      }
      document.getElementById('pb').innerHTML = h;
      document.getElementById('panel').classList.add('open');
    }

    document.getElementById('px').addEventListener('click', function(){ document.getElementById('panel').classList.remove('open'); });
  </script>

  <!-- Three.js -->
  <script>
  (function(){
    'use strict';

    /* ── Section definitions ───────────────────── */
    var SECS = [
      { key:'OVERVIEW', label:'Run Overview',  icon:'📊', col:0x334444, y:0  },
      { key:'ENERGY',   label:'Energy',        icon:'⚡', col:0x1ed760, y:8  },
      { key:'MOOD',     label:'Mood',          icon:'💭', col:0x9b7fb6, y:15 },
      { key:'GENRES',   label:'Genre DNA',     icon:'🎵', col:0xb967ff, y:22 },
      { key:'ARTISTS',  label:'Top Artists',   icon:'👤', col:0xffa42b, y:28 },
      { key:'DNA',      label:'Taste Profile', icon:'🧬', col:0x59cfcf, y:34 },
      { key:'CURATED',  label:'Curated',       icon:'🎧', col:0xf037a5, y:40 },
    ];

    var ENERGY_COL = { low:0x59cfcf, medium:0xffa42b, high:0x1ed760 };
    var ENERGY_H   = { low:1, medium:2, high:3 };
    var ARTIST_COL = [0xffa42b,0xffcc44,0xff8c00,0xffaa22,0xe89020];
    var DNA_COL    = [0xb967ff,0x59cfcf,0xf037a5,0x477dff,0xffa42b];
    var CURATED_C  = [0x1ed760,0x59cfcf,0xb967ff,0xf037a5,0xffa42b];

    function moodCol(mood){
      var m=(mood||'').toLowerCase();
      if(m.indexOf('nostalgic')>=0)  return 0x9b7fb6;
      if(m.indexOf('happy')>=0||m.indexOf('joyful')>=0) return 0xd4a820;
      if(m.indexOf('energetic')>=0||m.indexOf('upbeat')>=0) return 0xff6b35;
      if(m.indexOf('melancholic')>=0||m.indexOf('sad')>=0) return 0x4a7c9e;
      if(m.indexOf('calm')>=0||m.indexOf('peaceful')>=0) return 0x5fa8a8;
      if(m.indexOf('reflective')>=0||m.indexOf('introspective')>=0) return 0x6b84a0;
      if(m.indexOf('dark')>=0||m.indexOf('moody')>=0) return 0x6a4090;
      if(m.indexOf('relaxed')>=0||m.indexOf('chill')>=0) return 0x3a8a7a;
      if(m.indexOf('romantic')>=0) return 0xc0508a;
      return 0x8b4a6b;
    }

    function hex2css(h){ return '#'+h.toString(16).padStart(6,'0'); }

    function relTime(ts){
      if(!ts)return'';
      var s=(Date.now()-new Date(ts))/1000;
      if(s<3600) return Math.round(s/60)+'m ago';
      if(s<86400) return Math.round(s/3600)+'h ago';
      return Math.round(s/86400)+'d ago';
    }

    /* ── Load data ─────────────────────────────── */
    fetch('./data/history.json')
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(data){
        if(!data||!data.length){ showErr('No run history yet.'); return; }
        boot(data);
      })
      .catch(function(e){ showErr('Cannot load history: '+e.message); });

    function showErr(m){
      document.getElementById('loading').innerHTML='<p style="color:#444;max-width:300px;text-align:center;line-height:1.8">'+m+'</p>';
    }

    /* ── Boot ──────────────────────────────────── */
    function boot(data){
      var latest = data[data.length-1];
      document.getElementById('mpill').textContent  = latest.model||'ollama';
      document.getElementById('last-upd').textContent = 'Last run '+relTime(latest.timestamp);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ start(data); }); });
    }

    /* ── Three.js start ────────────────────────── */
    function start(allData){
      var wrap   = document.getElementById('wrap');
      var canvas = document.getElementById('c');
      var W = wrap.clientWidth, H = wrap.clientHeight;

      /* Renderer */
      var renderer = new THREE.WebGLRenderer({ canvas:canvas, antialias:true });
      renderer.setPixelRatio(Math.min(devicePixelRatio,2));
      renderer.setSize(W,H);
      renderer.setClearColor(0x050505);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
      renderer.outputEncoding    = THREE.sRGBEncoding;

      /* Scene + fog */
      var scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x050505, 22, 70);

      /* Perspective camera */
      var camera = new THREE.PerspectiveCamera(50, W/H, 0.1, 200);

      /* CSS2D labels */
      var labelR = new THREE.CSS2DRenderer();
      labelR.setSize(W,H);
      labelR.domElement.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;';
      wrap.appendChild(labelR.domElement);

      /* Lights — always store in variables first */
      var amb = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(amb);

      var sun = new THREE.DirectionalLight(0xfff4e0, 0.6);
      sun.position.set(10, 25, 8);
      sun.castShadow = true;
      sun.shadow.mapSize.width = sun.shadow.mapSize.height = 512;
      scene.add(sun);

      var fill = new THREE.DirectionalLight(0x1a2a60, 0.35);
      fill.position.set(-12, 10, -10);
      scene.add(fill);

      /* Ground */
      var ground = new THREE.Mesh(
        new THREE.PlaneGeometry(80,80),
        new THREE.MeshStandardMaterial({ color:0x080808, roughness:1 })
      );
      ground.rotation.x = -Math.PI/2;
      ground.position.y = -1;
      ground.receiveShadow = true;
      scene.add(ground);

      var grid = new THREE.GridHelper(50,50,0x0e0e0e,0x0a0a0a);
      grid.position.y = -0.98;
      scene.add(grid);

      /* Tower group */
      var tower = new THREE.Group();
      scene.add(tower);

      /* Per-section point lights */
      var secLights = [];
      SECS.forEach(function(s){
        var pl = new THREE.PointLight(s.col, 0.3, 12);
        pl.position.set(0, s.y+2, 0);
        tower.add(pl);
        secLights.push(pl);
      });

      /* ── CSS2D label helper ─────────────────── */
      var labelObjects = [];
      function makeLabel(text, colorHex, right){
        var div = document.createElement('div');
        div.className = 'lbl';
        div.style.color = hex2css(colorHex);
        var sp = document.createElement('span');
        sp.textContent = text;
        div.appendChild(sp);
        var obj = new THREE.CSS2DObject(div);
        labelObjects.push(obj);
        return obj;
      }

      /* ── Animated objects ───────────────────── */
      var anims = [];  /* {type, obj/mat, ...} */
      var clock = new THREE.Clock();

      /* ── Section meshes for raycasting ─────── */
      var hitMeshes = [];

      /* ── Material helpers ───────────────────── */
      function stdMat(col, opts){
        var o = opts||{};
        return new THREE.MeshStandardMaterial({
          color: col,
          emissive: o.emissive!=null ? new THREE.Color(o.emissive) : new THREE.Color(0x000000),
          emissiveIntensity: o.ei||0,
          roughness: o.r!=null?o.r:0.82,
          metalness: o.m!=null?o.m:0.08,
          transparent: !!o.tp, opacity: o.op||1
        });
      }

      function edgeLine(geo, col){
        return new THREE.LineSegments(
          new THREE.EdgesGeometry(geo),
          new THREE.LineBasicMaterial({ color: col })
        );
      }

      /* ── Slab helper ────────────────────────── */
      function slab(w, h, d, col, edgeCol, secKey){
        var g = new THREE.Group();
        var geo = new THREE.BoxGeometry(w, h, d);
        var mat = stdMat(col, { r:0.85, m:0.1 });
        var mesh = new THREE.Mesh(geo, mat);
        mesh.position.y = h/2;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.userData.section = secKey;
        g.add(mesh);
        hitMeshes.push(mesh);
        var el = edgeLine(geo, edgeCol);
        el.position.y = h/2;
        g.add(el);
        return g;
      }

      /* ══ SECTION BUILDERS ═══════════════════ */

      function buildOverview(run, yBase){
        var g = new THREE.Group();
        g.position.y = yBase;

        /* Platform */
        var sg = slab(8, 0.5, 8, 0x1c1c1c, 0x3a3a3a, 'OVERVIEW');
        g.add(sg);

        /* Four corner mini-pillars */
        [[3,3],[3,-3],[-3,3],[-3,-3]].forEach(function(xz){
          var ph = 0.8+Math.abs(Math.sin(xz[0]*xz[1]))*0.6;
          var pg = new THREE.BoxGeometry(0.35, ph, 0.35);
          var pm = stdMat(0x252525, {r:0.9});
          var mesh = new THREE.Mesh(pg, pm);
          mesh.position.set(xz[0], 0.5+ph/2, xz[1]);
          mesh.userData.section = 'OVERVIEW';
          hitMeshes.push(mesh);
          g.add(mesh);
          g.add(Object.assign(edgeLine(pg, 0x444444), { position: new THREE.Vector3(xz[0], 0.5+ph/2, xz[1]) }));
        });

        /* Date label */
        var lbl = makeLabel('📊 '+run.date, 0x555555);
        lbl.position.set(5, 1.5, 0);
        g.add(lbl);

        tower.add(g);
      }

      function buildEnergy(run, yBase){
        var g = new THREE.Group();
        g.position.y = yBase;
        var eC = ENERGY_COL[run.energy_level]||0x1ed760;
        var eH = ENERGY_H[run.energy_level]||2;

        /* Floor */
        g.add(slab(6, 0.4, 6, 0x0d1520, eC, 'ENERGY'));

        /* Energy bars */
        for(var i=0;i<5;i++){
          var bh = eH * 0.9 * (0.5 + 0.5*Math.abs(Math.sin(i*1.8+1)));
          var bGeo = new THREE.BoxGeometry(0.55, bh, 0.55);
          var bMat = stdMat(eC, { emissive:eC, ei:0.35, r:0.4 });
          var bar = new THREE.Mesh(bGeo, bMat);
          bar.position.set(i*1.1-2.2, 0.4+bh/2, 0);
          bar.castShadow = true;
          bar.userData.section = 'ENERGY';
          hitMeshes.push(bar);
          g.add(bar);
          g.add(Object.assign(edgeLine(bGeo, eC), { position: bar.position.clone() }));
          anims.push({ type:'pulse', mat:bMat, base:0.2, amp:0.3, freq:1.2+i*0.2, phase:i*0.8 });
        }

        var lbl = makeLabel('⚡ '+(run.energy_level||''), eC);
        lbl.position.set(4, 2.5, 0);
        g.add(lbl);
        tower.add(g);
      }

      function buildMood(run, yBase){
        var g = new THREE.Group();
        g.position.y = yBase;
        var mC = moodCol(run.mood);

        g.add(slab(6, 0.4, 6, 0x0a0a0a, mC, 'MOOD'));

        /* Sphere */
        var sGeo = new THREE.SphereGeometry(1.4, 32, 32);
        var sMat = stdMat(mC, { emissive:mC, ei:0.25, r:0.3, m:0.05, tp:true, op:0.88 });
        var sphere = new THREE.Mesh(sGeo, sMat);
        sphere.position.set(0, 0.4+1.5, 0);
        sphere.userData.section = 'MOOD';
        hitMeshes.push(sphere);
        g.add(sphere);

        /* Wireframe ring */
        var wGeo = new THREE.SphereGeometry(1.55, 14, 14);
        var wMat = new THREE.MeshBasicMaterial({ color:mC, wireframe:true, transparent:true, opacity:0.12 });
        var wf = new THREE.Mesh(wGeo, wMat);
        wf.position.copy(sphere.position);
        g.add(wf);
        anims.push({ type:'rotY', obj:wf, speed:0.008 });
        anims.push({ type:'pulse', mat:sMat, base:0.2, amp:0.2, freq:0.6, phase:0 });

        /* Small orbiter */
        var oGeo = new THREE.SphereGeometry(0.22, 10, 10);
        var oMat = stdMat(mC, { emissive:mC, ei:0.6, r:0.2 });
        var orb = new THREE.Mesh(oGeo, oMat);
        g.add(orb);
        anims.push({ type:'orbit', obj:orb, cx:0, cy:sphere.position.y, cz:0, r:2.2, speed:0.6, phase:0 });

        var lbl = makeLabel('💭 '+(run.mood||'').split(/[\s,]+/).slice(0,2).join(' '), mC);
        lbl.position.set(-4.2, 2.5, 0);
        g.add(lbl);
        tower.add(g);
      }

      function buildGenres(run, yBase){
        var g = new THREE.Group();
        g.position.y = yBase;
        var genres = (run.genres||[]).slice(0,5);

        g.add(slab(6.5, 0.4, 2.5, 0x0a0a0a, 0x333333, 'GENRES'));

        var sp = genres.length>1 ? 4/(genres.length-1) : 0;
        genres.forEach(function(genre, i){
          var gc = GC[i%5];
          var ph = 3.5 - i*0.55;
          var px = genres.length===1 ? 0 : -2+i*sp;
          var pGeo = new THREE.BoxGeometry(0.75, ph, 0.75);
          var pMat = stdMat(gc, { emissive:gc, ei:0.18, r:0.55 });
          var pillar = new THREE.Mesh(pGeo, pMat);
          pillar.position.set(px, 0.4+ph/2, 0);
          pillar.castShadow = true;
          pillar.userData.section = 'GENRES';
          hitMeshes.push(pillar);
          g.add(pillar);
          g.add(Object.assign(edgeLine(pGeo, gc), { position: pillar.position.clone() }));

          var gl = makeLabel(genre, gc);
          gl.position.set(px, 0.4+ph+0.8, 0);
          g.add(gl);
        });

        var lbl = makeLabel('🎵 Genres', GC[0]);
        lbl.position.set(4.5, 2, 0);
        g.add(lbl);
        tower.add(g);
      }

      function buildArtists(run, yBase){
        var g = new THREE.Group();
        g.position.y = yBase;

        var artists = (run.preferred_artists_detail||[]);
        if(!artists.length && run.preferred_artists)
          artists = run.preferred_artists.slice(0,5).map(function(n){ return{name:n}; });
        artists = artists.slice(0,5);

        g.add(slab(7, 0.4, 7, 0x0d0d0d, 0x333333, 'ARTISTS'));

        var n = artists.length||1;
        var R = n===1 ? 0 : 2.5;
        artists.forEach(function(a, i){
          var aC = ARTIST_COL[i%5];
          var angle = n===1 ? 0 : (i/n)*Math.PI*2;
          var ax = R*Math.cos(angle), az = R*Math.sin(angle);
          var cGeo = new THREE.CylinderGeometry(0.38, 0.48, 2, 16);
          var cMat = stdMat(aC, { emissive:aC, ei:0.12, r:0.5 });
          var cyl = new THREE.Mesh(cGeo, cMat);
          cyl.position.set(ax, 0.4+1, az);
          cyl.castShadow = true;
          cyl.userData.section = 'ARTISTS';
          hitMeshes.push(cyl);
          g.add(cyl);

          /* Top cap disc */
          var capGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
          var cap = new THREE.Mesh(capGeo, stdMat(aC, { emissive:aC, ei:0.45, r:0.3 }));
          cap.position.set(ax, 0.4+2.05, az);
          g.add(cap);
          anims.push({ type:'pulse', mat:cap.material, base:0.3, amp:0.35, freq:0.9+i*0.15, phase:i*1.1 });

          var al = makeLabel((a.name||'?').split(' ')[0], aC);
          al.position.set(ax, 0.4+2.8, az);
          g.add(al);
        });

        var lbl = makeLabel('👤 Artists', ARTIST_COL[0]);
        lbl.position.set(-4.5, 2, 0);
        g.add(lbl);
        tower.add(g);
      }

      function buildDNA(run, yBase){
        var g = new THREE.Group();
        g.position.y = yBase;
        var profile = (run.taste_profile||[]).slice(0,5);

        g.add(slab(4, 0.4, 4, 0x080810, 0xb967ff, 'DNA'));

        /* Double helix using TubeGeometry */
        var pts1=[], pts2=[];
        for(var i=0;i<=40;i++){
          var t=i/40, angle=t*Math.PI*4, hy=t*5;
          pts1.push(new THREE.Vector3(1.4*Math.cos(angle), 0.5+hy, 1.4*Math.sin(angle)));
          pts2.push(new THREE.Vector3(1.4*Math.cos(angle+Math.PI), 0.5+hy, 1.4*Math.sin(angle+Math.PI)));
        }
        var curve1 = new THREE.CatmullRomCurve3(pts1);
        var curve2 = new THREE.CatmullRomCurve3(pts2);
        var tGeo1 = new THREE.TubeGeometry(curve1, 80, 0.055, 8, false);
        var tGeo2 = new THREE.TubeGeometry(curve2, 80, 0.055, 8, false);
        var tMat1 = stdMat(0xb967ff, { emissive:0xb967ff, ei:0.45, r:0.3 });
        var tMat2 = stdMat(0x59cfcf, { emissive:0x59cfcf, ei:0.45, r:0.3 });
        var tube1 = new THREE.Mesh(tGeo1, tMat1);
        var tube2 = new THREE.Mesh(tGeo2, tMat2);
        tube1.userData.section = tube2.userData.section = 'DNA';
        hitMeshes.push(tube1, tube2);
        g.add(tube1); g.add(tube2);

        /* Cross-link beads */
        for(var i=0;i<8;i++){
          var t=i/7, angle=t*Math.PI*4, hy=t*5;
          var bGeo = new THREE.SphereGeometry(0.12, 8, 8);
          var b1=new THREE.Mesh(bGeo, stdMat(0xffffff,{emissive:0xffffff,ei:0.7,r:0.2}));
          var b2=b1.clone();
          b1.position.set(1.4*Math.cos(angle), 0.5+hy, 1.4*Math.sin(angle));
          b2.position.set(1.4*Math.cos(angle+Math.PI), 0.5+hy, 1.4*Math.sin(angle+Math.PI));
          g.add(b1); g.add(b2);
        }

        /* Rotate helix */
        var helixGroup = new THREE.Group();
        helixGroup.add(tube1); helixGroup.add(tube2);
        g.remove(tube1); g.remove(tube2);
        g.add(helixGroup);
        anims.push({ type:'rotY', obj:helixGroup, speed:0.005 });

        var lbl = makeLabel('🧬 Taste DNA', 0xb967ff);
        lbl.position.set(3.5, 3, 0);
        g.add(lbl);

        /* Profile word labels */
        profile.forEach(function(word, i){
          var wl = makeLabel(word, DNA_COL[i%5]);
          wl.position.set(-3.5, 0.8+i*1.0, 0);
          g.add(wl);
        });

        tower.add(g);
      }

      function buildCurated(run, yBase){
        var g = new THREE.Group();
        g.position.y = yBase;
        var tracks = (run.curated_tracks_sample||[]).slice(0,16);

        g.add(slab(7, 0.4, 7, 0x0a0008, 0xf037a5, 'CURATED'));

        var n = tracks.length||1;
        var R = Math.min(3, 1+n*0.18);
        tracks.forEach(function(t, i){
          var angle = (i/n)*Math.PI*2;
          var tc = CURATED_C[i%5];
          var cGeo = new THREE.BoxGeometry(0.75, 0.1, 0.55);
          var cMat = stdMat(tc, { emissive:tc, ei:0.3, r:0.4 });
          var card = new THREE.Mesh(cGeo, cMat);
          var by = 0.5 + (i%3)*0.25;
          card.position.set(R*Math.cos(angle), by, R*Math.sin(angle));
          card.rotation.y = -angle;
          card.userData.section = 'CURATED';
          hitMeshes.push(card);
          g.add(card);
          anims.push({ type:'bob', obj:card, by0:by, amp:0.18, freq:0.7+i*0.06, phase:angle*1.5 });
        });

        /* Central spike */
        var sGeo = new THREE.ConeGeometry(0.18, 2, 12);
        var sMat = stdMat(0xf037a5, { emissive:0xf037a5, ei:0.5, r:0.2 });
        var spike = new THREE.Mesh(sGeo, sMat);
        spike.position.set(0, 1.4, 0);
        spike.userData.section = 'CURATED';
        hitMeshes.push(spike);
        g.add(spike);
        anims.push({ type:'rotY', obj:spike, speed:0.012 });
        anims.push({ type:'pulse', mat:sMat, base:0.4, amp:0.4, freq:1.4, phase:0 });

        var lbl = makeLabel('🎧 Curated', 0xf037a5);
        lbl.position.set(4.5, 2.5, 0);
        g.add(lbl);
        tower.add(g);
      }

      /* ── Vertical shaft connecting floors ──── */
      function buildShaft(){
        var totalH = 45;
        var mid = 20;
        var shaftMat = stdMat(0x141414, {r:0.9, m:0.2});
        var shaftGeo = new THREE.BoxGeometry(0.25, totalH, 0.25);
        var shaft = new THREE.Mesh(shaftGeo, shaftMat);
        shaft.position.set(0, mid, 0);
        tower.add(shaft);
        /* 4 corner columns */
        [[2.8,2.8],[2.8,-2.8],[-2.8,2.8],[-2.8,-2.8]].forEach(function(xz){
          var col = new THREE.Mesh(
            new THREE.BoxGeometry(0.12, totalH, 0.12),
            stdMat(0x0f0f0f, {r:0.95})
          );
          col.position.set(xz[0], mid, xz[1]);
          tower.add(col);
        });
      }

      /* ── Clear tower ────────────────────────── */
      function clearTower(){
        labelObjects.forEach(function(o){
          if(o.element && o.element.parentNode) o.element.parentNode.removeChild(o.element);
        });
        labelObjects.length = 0;
        anims.length = 0;
        hitMeshes.length = 0;
        tower.traverse(function(o){
          if(o.geometry) o.geometry.dispose();
          if(o.material){
            if(Array.isArray(o.material)) o.material.forEach(function(m){m.dispose();});
            else o.material.dispose();
          }
        });
        while(tower.children.length) tower.remove(tower.children[0]);
        /* Re-add section lights */
        SECS.forEach(function(s,i){
          var pl = new THREE.PointLight(s.col, 0.3, 12);
          pl.position.set(0, s.y+2, 0);
          tower.add(pl);
          secLights[i] = pl;
        });
      }

      /* ── Build all sections ─────────────────── */
      var currentRun;
      function buildTower(run){
        currentRun = run;
        clearTower();
        buildShaft();
        buildOverview(run, SECS[0].y);
        buildEnergy(run,  SECS[1].y);
        buildMood(run,    SECS[2].y);
        buildGenres(run,  SECS[3].y);
        buildArtists(run, SECS[4].y);
        buildDNA(run,     SECS[5].y);
        buildCurated(run, SECS[6].y);
      }

      /* ── Scroll camera state ────────────────── */
      var currentSnap = 0;
      var camAngle    = Math.PI/4;
      var camRadius   = 10;
      var camElev     = 5;
      var targetY     = SECS[0].y;
      var smoothY     = SECS[0].y;
      var smoothLookY = SECS[0].y;

      /* ── Section dots ───────────────────────── */
      var dotsEl = document.getElementById('dots');
      var dotEls = [];
      SECS.forEach(function(s, i){
        var d = document.createElement('button');
        d.className = 'dot' + (i===0?' on':'');
        d.title = s.label;
        d.addEventListener('click', function(){ goToSection(i); });
        dotsEl.appendChild(d);
        dotEls.push(d);
      });

      function updateDots(idx){
        dotEls.forEach(function(d,i){ d.className='dot'+(i===idx?' on':''); });
        document.getElementById('hud').textContent = SECS[idx].icon+' '+SECS[idx].label;
        /* Highlight active section's point light */
        secLights.forEach(function(pl,i){
          pl.intensity = i===idx ? 1.8 : 0.3;
        });
      }

      /* Open panel after camera settles */
      var panelTimer;
      function goToSection(idx){
        idx = Math.max(0, Math.min(SECS.length-1, idx));
        if(idx===currentSnap) return;
        currentSnap = idx;
        targetY = SECS[idx].y;
        updateDots(idx);
        clearTimeout(panelTimer);
        panelTimer = setTimeout(function(){
          if(currentRun) renderPanel(SECS[idx].key, currentRun);
        }, 500);
      }

      /* ── Run navigation ─────────────────────── */
      var runIdx = allData.length-1;
      function updateRunNav(){
        var r = allData[runIdx];
        document.getElementById('nm').textContent = r.mood||'—';
        document.getElementById('nd').textContent = r.date+' · '+(runIdx+1)+'/'+allData.length;
        document.getElementById('bp').disabled = runIdx===0;
        document.getElementById('bn').disabled = runIdx===allData.length-1;
      }
      function goToRun(idx){
        runIdx = idx;
        updateRunNav();
        buildTower(allData[idx]);
        document.getElementById('panel').classList.remove('open');
      }
      document.getElementById('bp').addEventListener('click', function(){ if(runIdx>0) goToRun(runIdx-1); });
      document.getElementById('bn').addEventListener('click', function(){ if(runIdx<allData.length-1) goToRun(runIdx+1); });

      /* ── Raycaster ──────────────────────────── */
      var raycaster = new THREE.Raycaster();
      var mouse     = new THREE.Vector2();
      var tip = document.getElementById('tip');
      var NAMES = { OVERVIEW:'Run Overview', ENERGY:'Energy Level', MOOD:'Mood',
                    GENRES:'Genre DNA', ARTISTS:'Top Artists', DNA:'Taste Profile', CURATED:'Curated Playlist' };

      wrap.addEventListener('mousemove', function(e){
        var r = wrap.getBoundingClientRect();
        mouse.x  =  ((e.clientX-r.left)/r.width) *2-1;
        mouse.y  = -((e.clientY-r.top)/r.height)  *2+1;
        raycaster.setFromCamera(mouse, camera);
        var hits = raycaster.intersectObjects(hitMeshes, false);
        if(hits.length && hits[0].object.userData.section){
          var sec = hits[0].object.userData.section;
          document.getElementById('tt').textContent = NAMES[sec]||sec;
          document.getElementById('ts').textContent = (currentRun&&currentRun.mood)||'';
          tip.style.opacity='1';
          tip.style.left = Math.min(e.clientX-r.left+16, r.width-215)+'px';
          tip.style.top  = Math.max(e.clientY-r.top-14,4)+'px';
          document.body.style.cursor='pointer';
        } else {
          tip.style.opacity='0';
          document.body.style.cursor='';
        }
      });
      wrap.addEventListener('mouseleave', function(){ tip.style.opacity='0'; document.body.style.cursor=''; });
      wrap.addEventListener('click', function(e){
        var r = wrap.getBoundingClientRect();
        mouse.x  =  ((e.clientX-r.left)/r.width) *2-1;
        mouse.y  = -((e.clientY-r.top)/r.height)  *2+1;
        raycaster.setFromCamera(mouse, camera);
        var hits = raycaster.intersectObjects(hitMeshes, false);
        if(hits.length && hits[0].object.userData.section && currentRun){
          var sec = hits[0].object.userData.section;
          var si2 = SECS.findIndex(function(s){ return s.key===sec; });
          if(si2>=0 && si2!==currentSnap){ currentSnap=si2; targetY=SECS[si2].y; updateDots(si2); }
          renderPanel(sec, currentRun);
        }
      });

      /* ── Scroll / keyboard ──────────────────── */
      var scrollLock = false;
      function nudge(dir){
        if(scrollLock) return;
        goToSection(currentSnap+dir);
        scrollLock = true;
        setTimeout(function(){ scrollLock=false; }, 700);
      }
      wrap.addEventListener('wheel', function(e){
        e.preventDefault();
        if(Math.abs(e.deltaY)>5) nudge(e.deltaY>0?1:-1);
      }, { passive:false });
      document.addEventListener('keydown', function(e){
        if(e.key==='ArrowDown'||e.key==='PageDown') nudge(1);
        if(e.key==='ArrowUp'  ||e.key==='PageUp')   nudge(-1);
      });
      /* Touch */
      var ty0=0;
      wrap.addEventListener('touchstart', function(e){ ty0=e.touches[0].clientY; }, {passive:true});
      wrap.addEventListener('touchend',   function(e){
        var dy=ty0-e.changedTouches[0].clientY;
        if(Math.abs(dy)>30) nudge(dy>0?1:-1);
      }, {passive:true});

      /* ── Resize ─────────────────────────────── */
      window.addEventListener('resize', function(){
        W=wrap.clientWidth; H=wrap.clientHeight;
        camera.aspect=W/H; camera.updateProjectionMatrix();
        renderer.setSize(W,H);
        labelR.setSize(W,H);
      });

      /* ── Animation loop ─────────────────────── */
      function animate(){
        requestAnimationFrame(animate);
        var t = clock.getElapsedTime();

        /* Animate section elements */
        anims.forEach(function(a){
          if(a.type==='pulse')  a.mat.emissiveIntensity = a.base + a.amp*(0.5+0.5*Math.sin(t*a.freq+a.phase));
          if(a.type==='rotY')   a.obj.rotation.y += a.speed;
          if(a.type==='bob')    a.obj.position.y = a.by0 + a.amp*Math.sin(t*a.freq+a.phase);
          if(a.type==='orbit'){
            a.obj.position.set(
              a.cx + a.r*Math.cos(t*a.speed+a.phase),
              a.cy,
              a.cz + a.r*Math.sin(t*a.speed+a.phase)
            );
          }
        });

        /* Smooth camera scroll */
        camAngle += 0.004;
        smoothY     += (targetY     - smoothY)     * 0.055;
        smoothLookY += (targetY     - smoothLookY) * 0.055;

        camera.position.set(
          camRadius * Math.cos(camAngle),
          smoothY + camElev,
          camRadius * Math.sin(camAngle)
        );
        camera.lookAt(0, smoothLookY, 0);

        /* Smooth section light intensities */
        secLights.forEach(function(pl,i){
          var tgt = i===currentSnap ? 1.8 : 0.3;
          pl.intensity += (tgt-pl.intensity)*0.05;
        });

        renderer.render(scene, camera);
        labelR.render(scene, camera);
      }

      /* ── Kick off ───────────────────────────── */
      goToRun(runIdx);
      updateDots(0);
      document.getElementById('hud').textContent = SECS[0].icon+' '+SECS[0].label;
      animate();
    }

  })();
  </script>
</body>
</html>
