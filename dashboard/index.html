<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OllamaPlaylist</title>
  <!-- Anime.js v3 — sets window.anime before any module runs -->
  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

  <header class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <span class="logo">OLLAMAPLAYLIST</span>
      <span id="mpill" class="pill">—</span>
    </div>
    <span id="last-upd"></span>
  </header>

  <div id="loading">
    <div class="spin"></div>
    <p>LOADING...</p>
  </div>

  <div id="app">
    <div id="scroller">
      <div id="stage">

        <!-- Pixel-art boombox -->
        <div id="boombox-scale">
          <div id="boombox-container"></div>
        </div>

        <!-- Data panels (populated by JS, revealed by scroll) -->
        <div id="panels-wrap"></div>

        <!-- HUD overlay -->
        <div id="hud">
          <span id="section-label"></span>
          <span id="scroll-hint">▼ SCROLL TO DISASSEMBLE</span>
          <div id="section-dots"></div>
        </div>

        <!-- Run navigator -->
        <div id="run-nav">
          <button class="rnb" id="bp">◄</button>
          <div style="text-align:center">
            <div id="run-mood"></div>
            <div id="run-info"></div>
          </div>
          <button class="rnb" id="bn">►</button>
        </div>

      </div><!-- #stage -->
    </div><!-- #scroller -->
  </div><!-- #app -->

  <script type="module" src="./js/main.js"></script>

</body>
</html>
